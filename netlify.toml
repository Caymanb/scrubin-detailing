# Netlify configuration for Scrubin Detailing
# You don't need to touch this — it tells Netlify how to serve the site.

[build]
  publish = "."

# index_1.html was a stale duplicate of the homepage and has been deleted. Anything
# still pointing at that URL (an old bookmark, a crawler) lands on the homepage instead
# of a 404. Its canonical already pointed at "/", so no ranking signal moves.
[[redirects]]
  from = "/index_1.html"
  to = "/"
  status = 301

# Old /book-now URL now points at the quote form on the homepage. The section is
# <section id="quote"> and holds the quote form, so the fragment lands on it.
[[redirects]]
  from = "/book-now"
  to = "/#quote"
  status = 301

# Images never change unless you rename them, so let browsers cache them for a year.
# This is what makes repeat visits load almost instantly.
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    # While the site is only up for private review, remove the "#" from the next
    # line to keep Google from indexing this URL. Put the "#" back before launch.
    # X-Robots-Tag = "noindex"
